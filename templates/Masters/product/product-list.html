{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Product List{% endblock %}

{% block layout %}
<div class="card">
  <div class="d-flex justify-content-between align-items-center">
    <h5 class="card-header">Product</h5>

    <div class="d-flex justify-content-end">
      <div class="d-flex align-items-center">
        <i class="ri-search-line ri-22px me-2"></i>
        <input type="text" id="search"
          class="form-control border-0 shadow-none bg-body"
          placeholder="Search..." onkeyup="Pagination()" />
      </div>
      <a class="btn btn-primary m-4" href="/masters/add-product">Add Product</a>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Sr No</th>
          <th>Part Code</th>
          <th>Name</th>
          <th>Mould</th>
          <th>Price</th>
          <th>GST %</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="product_table_body"></tbody>
    </table>

    <div class="d-flex justify-content-end m-3" id="secondpagination-demo2">
      <ul id="pagination-demo2" class="pagination-sm"></ul>
    </div>
  </div>
</div>
{% endblock layout %}
{% block page_js %}
{{ block.super }}
<script>
$(document).ready(() => Pagination());

function Pagination() {
  $('#secondpagination-demo2').html('<ul id="pagination-demo2" class="pagination-sm"></ul>');
  loadData(1);
}

function loadData(p) {
  let fd = new FormData();
  fd.append('p', p);
  fd.append('searchtext', $('#search').val());
  fd.append('csrfmiddlewaretoken', '{{ csrf_token }}');

  $.ajax({
    url: hosturl + "/api/Masters/product_list_pagination_api",
    headers: { "Authorization": "Bearer {{token}}" },
    type: "POST",
    data: fd,
    processData: false,
    contentType: false,
    success: function (res) {
      let html = '';
      let counter = ((p - 1) * 10) + 1;

      if (res.count > 0) {
        $.each(res.results, function (i, o) {
          html += `
            <tr>
              <td>${counter++}</td>
              <td>${o.part_code}</td>
              <td>${o.name}</td>
              <td>${o.mould}</td>
              <td>${o.price_per_unit}</td>
              <td>${o.gst_percentage}</td>
              <td>
                <a href="/masters/edit-product/${o.id}" class="btn btn-sm btn-primary">Edit</a>
                <button class="btn btn-sm btn-danger" onclick="deleteProduct(${o.id})">Delete</button>
              </td>
            </tr>`;
        });
        $('#product_table_body').html(html);
      }
    }
  });
}

function deleteProduct(id) {
  swal({
    title: "Are you sure?",
    text: "Delete this product?",
    icon: "warning",
    buttons: true,
    dangerMode: true
  }).then(ok => {
    if (ok) {
      $.post(
        hosturl + "/api/Masters/delete_product",
        { csrfmiddlewaretoken: '{{ csrf_token }}', id: id },
        res => swal(res.response.msg).then(() => Pagination())
      );
    }
  });
}
</script>
{% endblock page_js %}
