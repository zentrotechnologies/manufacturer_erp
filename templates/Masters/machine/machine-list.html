{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Machine List{% endblock %}

{% block layout %}
<div class="card">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h5 class="card-header">Machine</h5>
    </div>

    <div class="d-flex justify-content-end">
      <div class="d-flex align-items-center">
        <i class="ri-search-line ri-22px me-2"></i>
        <input type="text" id="search"
          class="form-control border-0 shadow-none bg-body"
          placeholder="Search..." onkeyup="Pagination()" />
      </div>

      <a class="btn btn-primary m-4" href="/masters/add-machine">
        Add Machine
      </a>
    </div>
  </div>

  <div class="table-responsive text-nowrap">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Sr No</th>
          <th>Machine Code</th>
          <th>Machine Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="machine_table_body"></tbody>
    </table>

    <div class="d-flex justify-content-end m-3" id="secondpagination-demo2">
      <ul id="pagination-demo2" class="pagination-sm"></ul>
    </div>
  </div>
</div>
{% endblock layout %}
{% block page_js %}
{{ block.super }}

<script>
$(document).ready(function () {
  Pagination();
});

function Pagination() {
  $('#secondpagination-demo2').html('<ul id="pagination-demo2" class="pagination-sm"></ul>');
  get_table_data(1);
}

function get_table_data(p) {
  var search = $('#search').val() || '';

  var fd = new FormData();
  fd.append('p', p);
  fd.append('searchtext', search);
  fd.append('csrfmiddlewaretoken', '{{ csrf_token }}');

  $.ajax({
    url: hosturl + "/api/Masters/machine_list_pagination_api",
    headers: { "Authorization": "Bearer {{token}}" },
    type: 'POST',
    data: fd,
    processData: false,
    contentType: false,

    beforeSend: function () {
      swal({ icon: "info", text: "Loading...", buttons: false });
    },

    success: function (response) {
      swal.close();
      let html = '';
      let counter = ((p - 1) * 10) + 1;

      if (response.count > 0) {
        $.each(response.results, function (i, o) {
          html += `
            <tr>
              <td>${counter++}</td>
              <td>${o.machine_code || ''}</td>
              <td>${o.name || ''}</td>
              <td>
                <div class="dropdown">
                  <button class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
                    <i class="ri-more-2-line"></i>
                  </button>
                  <div class="dropdown-menu">
                    <a class="dropdown-item" href="/masters/edit-machine/${o.id}">
                      <i class="ri-pencil-line me-1"></i> Edit
                    </a>
                    <a class="dropdown-item" href="javascript:void(0);" onclick="delete_machine('${o.id}')">
                      <i class="ri-delete-bin-6-line me-1"></i> Delete
                    </a>
                  </div>
                </div>
              </td>
            </tr>`;
        });

        $('#machine_table_body').html(html);

        $('#pagination-demo2').twbsPagination({
          totalPages: Math.ceil(response.count / 10),
          visiblePages: 3,
          onPageClick: function (e, page) {
            get_table_data(page);
          }
        });
      } else {
        $('#machine_table_body').html(
          `<tr><td colspan="4" class="text-center">No Data Found</td></tr>`
        );
      }
    }
  });
}

function delete_machine(id) {
  swal({
    title: "Are you sure?",
    text: "You want to delete it.",
    icon: "warning",
    buttons: true,
    dangerMode: true
  }).then((ok) => {
    if (ok) {
      $.post(
        hosturl + "/api/Masters/delete_machine",
        {
          csrfmiddlewaretoken: '{{ csrf_token }}',
          id: id
        },
        function (res) {
          if (res.response.n == 1) {
            swal("Deleted!", res.response.msg, "success")
              .then(() => Pagination());
          } else {
            swal("Error", res.response.msg, "error");
          }
        }
      );
    }
  });
}
</script>
{% endblock page_js %}
