{% extends "base.html" %}
{% load static %}

{% block title %}Add Production Entry{% endblock %}

{% block layout %}
<div class="card">
  <div class="card-header">
    <h5>Add Production Entry</h5>
  </div>

  <div class="card-body">
    <form>
      {% csrf_token %}

      <div class="row">

        <div class="col-md-3">
          <label>Date</label>
          <input type="date" id="production_date" class="form-control">
        </div>

        <div class="col-md-3">
          <label>Shift</label>
          <select id="shift" class="form-control">
            <option value="A">Shift A</option>
            <option value="B">Shift B</option>
            <option value="C">Shift C</option>
          </select>
        </div>

        <div class="col-md-3">
          <label>Machine</label>
          <select id="machine" class="form-control">
            {% for m in machines %}
            <option value="{{m.id}}">{{m.machine_code}}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-3">
          <label>Mould</label>
          <select id="mould" class="form-control">
            {% for m in moulds %}
            <option value="{{m.id}}">{{m.mould_code}}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-4 mt-3">
          <label>Product</label>
          <select id="product" class="form-control">
            {% for p in products %}
            <option value="{{p.id}}">{{p.name}}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4 mt-3">
          <label>Batch</label>
          <select id="batch" class="form-control">
            {% for b in batches %}
            <option value="{{b.id}}">{{b.batch_name}}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4 mt-3">
          <label>Batches Made</label>
          <input type="number" id="batches_made" class="form-control">
        </div>

        <div class="col-md-4 mt-3">
          <label>Finished Qty</label>
          <input type="number" id="finished_qty" class="form-control">
        </div>

        <div class="col-md-4 mt-3">
          <label>Rejected Qty</label>
          <input type="number" id="rejected_qty" class="form-control" value="0">
        </div>
        <div class="col-md-4 mt-3">
          <label>Accepted Qty</label>
          <input type="number" id="accepted_qty" class="form-control" readonly>
        </div>
        <div class="col-md-8 mt-3">
          <label>Operator Name</label>
          <input type="text" id="operator_name" class="form-control">
        </div>

        <div class="col-md-12 mt-3">
          <label>Remarks</label>
          <textarea id="remarks" class="form-control"></textarea>
        </div>

      </div>

      <br>

      <button type="button" class="btn btn-primary" onclick="submitProduction()">
        Submit
      </button>
      <a href="javascript:history.back()" class="btn btn-danger">Cancel</a>

    </form>
  </div>
</div>
{% endblock %}
{% block page_js %}
{{block.super}}
<script>
  $('#finished_qty,#rejected_qty').on('keyup change', function () {

    let produced = parseFloat($('#finished_qty').val()) || 0;
    let rejected = parseFloat($('#rejected_qty').val()) || 0;

    $('#accepted_qty').val(produced - rejected);
  });
  function submitProduction() {

    let finished = parseFloat($('#finished_qty').val()) || 0;
    let rejected = parseFloat($('#rejected_qty').val()) || 0;

    if (finished <= 0) {
      swal("finished quantity must be greater than zero");
      return;
    }

    if (rejected >= finished) {
      swal("Rejected quantity cannot be equal or more than finished");
      return;
    }

    let fd = new FormData();
    fd.append('csrfmiddlewaretoken', '{{csrf_token}}');
    fd.append('production_date', $('#production_date').val());
    fd.append('shift', $('#shift').val());
    fd.append('machine', $('#machine').val());
    fd.append('mould', $('#mould').val());
    fd.append('product', $('#product').val());
    fd.append('batch', $('#batch').val());

    fd.append('batches_made', $('#batches_made').val());
    fd.append('finished_qty', finished);
    fd.append('rejected_qty', rejected);
    fd.append('operator_name', $('#operator_name').val());
    fd.append('remarks', $('#remarks').val());

    $.ajax({
      url: "/production/add-production-entry",
      type: "POST",
      data: fd,
      processData: false,
      contentType: false,

      beforeSend: () => swal({ text: "Saving...", buttons: false }),

      success: function (res) {
        if (res.response.n === 1) {
          swal(res.response.msg).then(() => {
            window.location.href = "/production/production-list";
          });
        } else {
          swal(res.response.msg);
        }
      }
    });
  }
</script>
{% endblock %}
