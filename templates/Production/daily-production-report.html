{% extends "base.html" %}
{% block title %}Daily Production Report{% endblock %}

{% block layout %}
<div class="card">
    <div class="card-header d-flex justify-content-between">
        <h5>Daily Production Report</h5>
        <div class="d-flex">
            <div class="mx-1">
                <input type="date" id="report_date" class="form-control w-100">

            </div>
            <div class="mx-1">
                <button class="btn btn-primary mb-3" onclick="loadReport()">Generate</button>
            </div>
            <div class="mx-1">
                <button class="btn btn-success mb-3" onclick="exportExcel()">
                    Export to Excel
                </button>
            </div>
        </div>
    </div>

    <div class="card-body">

        <div id="report_container"></div>
    </div>
</div>
{% endblock %}
{% block page_js %}
{{block.super}}
<script>




    function exportExcel() {
        let date = $('#report_date').val();

        if (!date) {
            swal("Please select a date first");
            return;
        }

        window.location.href =
            hosturl +
            "/api/Production/export_daily_production_report_excel?date=" +
            date;
    }

    function loadReport() {
        let date = $('#report_date').val();

        if (!date) {
            swal("Please select a date first");
            return;
        }
        let fd = new FormData();
        fd.append('date', $('#report_date').val());
        fd.append('csrfmiddlewaretoken', '{{csrf_token}}');

        $.ajax({
            url: hosturl + "/api/Production/daily_production_report_api",
            headers: { "Authorization": "Bearer {{token}}" },
            type: "POST",
            data: fd,
            processData: false,
            contentType: false,

            beforeSend: () => swal({ text: "Loading...", buttons: false }),

            success: function (res) {
                swal.close();

                if (res.response.n == 1) {

                    let html = '';

                    res.data.forEach(r => {

                        html += `
<div class="border p-3 mb-4">

  <h6>${r.product} | Machine: ${r.machine} | Shift: ${r.shift}</h6>

  <div class="row text-center">

    <div class="col">
      <b>Produced</b><br>${r.finished_qty}
    </div>

    <div class="col">
      <b>Rejected</b><br>${r.rejected_qty}
    </div>

    <div class="col">
      <b>Accepted</b><br>${r.accepted_qty}
    </div>

    <div class="col">
      <b>Rate</b><br>₹${r.production_rate}
    </div>

    <div class="col">
      <b>Production Value</b><br>₹${r.production_value}
    </div>

    <div class="col">
      <b>Material Cost</b><br>₹${r.total_material_cost}
    </div>

    <div class="col">
      <b>Cons %</b><br>${r.consumption_percent}%
    </div>

    <div class="col">
      <b>P/L</b><br>
      <span style="color:${r.profit_loss < 0 ? 'red' : 'green'}">
        ₹${r.profit_loss}
      </span>
    </div>

  </div>

  <table class="table table-sm mt-3">
    <thead>
      <tr>
        <th>Raw Material</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Value</th>
      </tr>
    </thead>

    <tbody>
      ${r.materials.map(m => `
        <tr>
          <td>${m.raw_material}</td>
          <td>${m.qty}</td>
          <td>${m.rate}</td>
          <td>${m.value}</td>
        </tr>
      `).join('')}
    </tbody>
  </table>

</div>
`;
                    });

                    // 🔥 TOTAL CALCULATION
                    let totalProduction = 0;
                    let totalCost = 0;

                    res.data.forEach(r => {
                        totalProduction += r.production_value;
                        totalCost += r.total_material_cost;
                    });

                    let totalPL = totalProduction - totalCost;

                    // 🔥 APPEND SUMMARY
                    html += `
<div class="card p-3 mt-3 text-center">

  <h5>Total Production: ₹${totalProduction.toFixed(2)}</h5>
  <h5>Total Cost: ₹${totalCost.toFixed(2)}</h5>

  <h4 style="color:${totalPL < 0 ? 'red' : 'green'}">
    Profit/Loss: ₹${totalPL.toFixed(2)}
  </h4>

</div>
`;

                    // ✅ FINAL RENDER (ONLY ONCE)
                    $('#report_container').html(html);

                } else {
                    swal(res.response.msg);
                }
            }
        });
    }

    document.getElementById("report_date").value = new Date().toISOString().split('T')[0];
    loadReport()

</script>
{% endblock %}
