{% extends "base.html" %}
{% block title %}Production Entries{% endblock %}

{% block layout %}
<style>
.table td, .table th {
  padding: 6px 8px;
  vertical-align: middle;
}
.table-secondary td {
  background: #f3f4f6 !important;
}
</style>

<div class="card">
  <div class="d-flex justify-content-between align-items-center">
    <h5 class="card-header">Production Entries</h5>

    <div class="d-flex align-items-center">
      <input id="search" class="form-control me-2"
             placeholder="Search..." onkeyup="Pagination()">
      <a href="/production/add-production-entry"
         class="btn btn-primary">Add Entry</a>
    </div>
  </div>

<table class="table table-hover">
  <thead>
    <tr>
      <th style="width:60px">#</th>
      <th>Shift</th>
      <th>Machine</th>
      <th>Product</th>
      <th>Produced</th>
      <th>Rejected</th>
      <th style="width:100px">Action</th>
    </tr>
  </thead>
  <tbody id="production_table"></tbody>
</table>

  <div class="d-flex justify-content-end p-3">
    <ul id="pagination-demo" class="pagination-sm"></ul>
  </div>
</div>
{% endblock %}
{% block page_js %}
{{block.super}}
<script>
$(document).ready(()=>Pagination());

function Pagination(){
  $('#pagination-demo').html('');
  loadData(1);
}

function loadData(p){

  let fd = new FormData();
  fd.append('p', p);
  fd.append('searchtext', $('#search').val());
  fd.append('csrfmiddlewaretoken', '{{csrf_token}}');

  $.ajax({
    url: hosturl + "/api/Production/production_entry_list_pagination_api",
    headers: {"Authorization":"Bearer {{token}}"},
    type: "POST",
    data: fd,
    processData:false,
    contentType:false,

    success: function(res){
      let html = '';
      let counter = ((p - 1) * 10) + 1;

      // ---- GROUP BY DATE ----
      let grouped = {};
      res.results.forEach(o => {
        if(!grouped[o.production_date]){
          grouped[o.production_date] = [];
        }
        grouped[o.production_date].push(o);
      });

      // ---- RENDER ----
      Object.keys(grouped).forEach(date => {

        // DATE HEADER ROW
        html += `
          <tr class="table-secondary">
            <td colspan="7" class="fw-bold">
              📅 ${date}
            </td>
          </tr>
        `;

        // DATA ROWS UNDER DATE
        grouped[date].forEach(o => {
          html += `
            <tr>
              <td>${counter++}</td>
              <td>${o.shift}</td>
              <td>${o.machine}</td>
              <td>${o.product}</td>
              <td>${o.accepted_qty}</td>
              <td>${o.rejected_qty}</td>
              <td>
                <a class="btn btn-sm btn-outline-info"
                   href="/production/view-production/${o.id}">
                   View
                </a>
              </td>
            </tr>
          `;
        });

      });

      $('#production_table').html(html);
    }
  });
}
</script>

{% endblock %}
